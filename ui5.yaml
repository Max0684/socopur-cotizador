specVersion: "4.0"
metadata:
  name: com.socopur.cotizador
type: application
framework:
  name: SAPUI5
  # Version de desarrollo local. La version real la fija el frontend server de S/4 de Socopur (por confirmar).
  version: "1.120.52"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.uxap
    - name: sap.ui.unified
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
