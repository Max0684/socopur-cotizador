_schema-version: "3.2"
ID: socopur-cotizador
description: Cotizador Socopur (UI5 Freestyle) publicado en el repositorio HTML5 de BTP
version: 0.3.9
modules:
  - name: socopur-cotizador-destination-content
    type: com.sap.application.content
    requires:
      - name: socopur-cotizador-destination-service
        parameters:
          content-target: true
      - name: socopur-cotizador-repo-host
        parameters:
          service-key:
            name: socopur-cotizador-repo-host-key
      - name: socopur-cotizador-uaa
        parameters:
          service-key:
            name: socopur-cotizador-uaa-key
    parameters:
      content:
        instance:
          destinations:
            - Name: socopur-cotizador_html_repo_host
              ServiceInstanceName: socopur-cotizador-html5-srv
              ServiceKeyName: socopur-cotizador-repo-host-key
              sap.cloud.service: socopur.cotizador
            - Authentication: OAuth2UserTokenExchange
              Name: socopur-cotizador_uaa
              ServiceInstanceName: socopur-cotizador-xsuaa-service
              ServiceKeyName: socopur-cotizador-uaa-key
              sap.cloud.service: socopur.cotizador
          existing_destinations_policy: update
    build-parameters:
      no-source: true
  - name: socopur-cotizador-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: socopur-cotizador-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - comsocopurcotizador.zip
          name: comsocopurcotizador
          target-path: resources/
  - name: comsocopurcotizador
    type: html5
    path: .
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []
resources:
  - name: socopur-cotizador-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: socopur-cotizador-destination-service
      service-plan: lite
  - name: socopur-cotizador-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-name: socopur-cotizador-xsuaa-service
      service-plan: application
  - name: socopur-cotizador-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: socopur-cotizador-html5-srv
      service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
