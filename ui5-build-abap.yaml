# Compilacion de la app para subirla al S/4 (npm run build:abap). Solo genera la carpeta dist; no escribe en SAP.
specVersion: "4.0"
metadata:
  name: com.socopur.cotizador
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
