# Despliegue al S/4 (aplicacion UI5 / BSP) para publicarla en el Fiori Launchpad del propio S/4.
# Uso en BAS: npm run deploy:abap:prueba (compila y simula, no escribe) y luego npm run deploy:abap (sube la app).
# Se sube por el mandante 130. Requiere que el Gateway del 130 tenga el perfil de virus scan resuelto (GATEWAY_VIRUSCAN_PROFILE).
specVersion: "4.0"
metadata:
  name: com.socopur.cotizador
type: application
builder:
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: S4HANA_AROJAS2
          client: "130"
        app:
          name: YCOTIZADOR
          description: Cotizador Socopur
          package: YSDCOTI001
          transport: DS4K917450
        exclude:
          - /test/
          - \.ts$
